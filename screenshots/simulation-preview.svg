<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Title Bar -->
  <rect x="25" y="25" width="750" height="60" rx="8" fill="#111827" stroke="#2d3748" stroke-width="1"/>
  <text x="50" y="60" fill="#60a5fa" font-size="18" font-weight="bold">🚩 FeatureFlag Pro — Monte Carlo 1,000-User Simulation</text>
  <rect x="660" y="42" width="95" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="677" y="59" fill="#34d399" font-size="11" font-weight="bold">ZERO-LATENCY</text>

  <!-- Summary Card -->
  <rect x="25" y="100" width="750" height="110" rx="10" fill="url(#cardGrad)" stroke="#2d3748" stroke-width="1"/>
  
  <text x="50" y="135" fill="#f3f4f6" font-size="16" font-weight="bold">Target Allocation: 25.0% Canary Rollout (new-checkout-v2)</text>
  <text x="50" y="160" fill="#9ca3af" font-size="13">Evaluated 1,000 distinct user IDs using 32-bit MurmurHash3 sticky bucketing algorithm.</text>

  <!-- Stat Pills -->
  <rect x="50" y="175" width="160" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="60" y="191" fill="#34d399" font-size="11" font-weight="bold">Active: 254 Users (25.4%)</text>

  <rect x="225" y="175" width="160" height="24" rx="4" fill="#374151"/>
  <text x="235" y="191" fill="#9ca3af" font-size="11" font-weight="bold">Control: 746 Users (74.6%)</text>

  <rect x="400" y="175" width="160" height="24" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="410" y="191" fill="#60a5fa" font-size="11" font-weight="bold">Variance: +0.40%</text>

  <!-- Distribution Bar -->
  <rect x="25" y="230" width="750" height="40" rx="6" fill="#0d131f" stroke="#2d3748" stroke-width="1"/>
  <rect x="25" y="230" width="190" height="40" rx="6" fill="#10b981"/>
  <text x="75" y="255" fill="#ffffff" font-size="13" font-weight="bold">25.4% Active (v2)</text>
  <rect x="215" y="230" width="560" height="40" rx="6" fill="#1f2937"/>
  <text x="450" y="255" fill="#9ca3af" font-size="13" font-weight="bold">74.6% Control (v1)</text>

  <!-- Findings / Details -->
  <rect x="25" y="290" width="750" height="135" rx="8" fill="#161e2e" stroke="#2d3748" stroke-width="1"/>
  <text x="45" y="320" fill="#f3f4f6" font-size="14" font-weight="bold">Deterministic Sticky Bucketing Verification</text>
  <text x="45" y="345" fill="#9ca3af" font-size="12">1. Uniformity Test: Hash values demonstrate uniform distribution across the [0, 99] integer bucket interval.</text>
  <text x="45" y="370" fill="#9ca3af" font-size="12">2. Idempotency Test: 100% of re-tested users maintained identical variant assignment on re-evaluation.</text>
  <text x="45" y="395" fill="#34d399" font-size="12" font-weight="bold">3. Rule Bypass Verification: Users with tier="vip" bypass percentage bucketing and receive 100% enablement.</text>
</svg>
