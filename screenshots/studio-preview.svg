  <text x="45" y="160" fill="#f3f4f6" font-size="12" font-family="monospace">new-checkout-v2</text>

  <!-- Rollout Slider Box -->
  <rect x="35" y="185" width="430" height="95" rx="6" fill="#161e2e" stroke="#2d3748" stroke-width="1"/>
