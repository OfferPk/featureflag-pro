<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#111827" stroke="#2d3748" stroke-width="1"/>
