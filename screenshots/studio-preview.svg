  <text x="190" y="30" fill="#60a5fa" font-size="10" font-weight="bold">v1.0.0</text>
  
  <rect x="240" y="16" width="105" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
