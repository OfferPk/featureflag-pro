  <rect x="147" y="245" width="308" height="20" rx="4" fill="#1f2937"/>
  <text x="260" y="259" fill="#9ca3af" font-size="9" font-weight="bold">74% Legacy Control</text>

  <!-- Targeting Rules List -->
  <text x="35" y="305" fill="#9ca3af" font-size="11" font-weight="bold">User Targeting Rules (Priority Order):</text>
  
  <!-- Rule 1 -->
  <rect x="35" y="320" width="430" height="65" rx="6" fill="#161e2e" stroke="#2d3748" stroke-width="1"/>
  <rect x="35" y="320" width="4" height="65" rx="2" fill="#3b82f6"/>
  <text x="50" y="340" fill="#f3f4f6" font-size="11" font-weight="bold">Rule #1: VIP Customer Bypass</text>
  <rect x="370" y="327" width="85" height="18" rx="3" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="382" y="340" fill="#60a5fa" font-size="9" font-weight="bold">force_true</text>
  <text x="50" y="365" fill="#60a5fa" font-size="10" font-family="monospace">IF tier equals "vip" ➔ 100% Enabled</text>

  <!-- Rule 2 -->
  <rect x="35" y="395" width="430" height="65" rx="6" fill="#161e2e" stroke="#2d3748" stroke-width="1"/>
  <rect x="35" y="395" width="4" height="65" rx="2" fill="#3b82f6"/>
