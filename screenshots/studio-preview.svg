  <text x="415" y="210" fill="#10b981" font-size="14" font-weight="bold" font-family="monospace">25%</text>
  
  <rect x="45" y="225" width="410" height="6" rx="3" fill="#374151"/>
  <rect x="45" y="225" width="102" height="6" rx="3" fill="#3b82f6"/>
  
  <rect x="45" y="245" width="102" height="20" rx="4" fill="#10b981"/>
